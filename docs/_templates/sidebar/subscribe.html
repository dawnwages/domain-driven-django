<div class="ddd-subscribe">
  <p class="ddd-subscribe__eyebrow">Follow along</p>
  <p class="ddd-subscribe__title">Get new chapters of <em>Domain Driven Django</em> by email.</p>
  <form
    action="https://buttondown.com/api/emails/embed-subscribe/ddd"
    method="post"
    target="popupwindow"
    onsubmit="window.open('https://buttondown.com/ddd', 'popupwindow')"
  >
    <label for="bd-email" class="ddd-visually-hidden">Email address</label>
    <input type="email" name="email" id="bd-email" placeholder="you@example.com" required />
    <button type="submit">Subscribe</button>
  </form>
  <p class="ddd-subscribe__credit"><a href="https://buttondown.com/refer/ddd" target="_blank" rel="noopener">Powered by Buttondown</a></p>
</div>
